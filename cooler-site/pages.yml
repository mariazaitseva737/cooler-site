# Pages CMS configuration: https://pagescms.org
# Open app.pagescms.org, sign in with GitHub and choose this repository.
content:
  - name: articles-ru
    label: "Статьи (RU)"
    type: collection
    path: cooler-site/src/content/articles/ru
    filename: "{fields.slug}.md"
    view:
      fields: [ title, topic, published, draft ]
    fields:
      - { name: title, label: "Заголовок на странице", type: string, required: true }
      - { name: slug, label: "Адрес (латиницей, через дефис)", type: string, required: true }
      - { name: lang, label: "Язык", type: select, options: { values: [ru, en] }, default: ru, required: true }
      - { name: translationKey, label: "Ключ перевода (одинаковый у RU и EN версии)", type: string, required: true }
      - { name: seoTitle, label: "SEO-заголовок (до 60 знаков)", type: string, required: true }
      - { name: description, label: "SEO-описание (120–160 знаков)", type: text, required: true }
      - { name: focusKeyword, label: "Главный поисковый запрос", type: string }
      - { name: topic, label: "Тема", type: string, required: true }
      - { name: readingTime, label: "Время чтения", type: string, required: true }
      - { name: published, label: "Дата публикации", type: date, required: true }
      - { name: updated, label: "Дата обновления", type: date }
      - { name: featured, label: "Главная статья журнала", type: boolean }
      - { name: draft, label: "Черновик (не показывать на сайте)", type: boolean }
      - { name: reviewer, label: "Научный редактор", type: string }
      - { name: lead, label: "Вводный абзац", type: text, required: true }
      - { name: summary, label: "Коротко (3–4 пункта)", type: string, list: true }
      - name: terms
        label: "Термины для врача"
        type: object
        list: true
        fields:
          - { name: term, label: "Термин", type: string }
          - { name: translation, label: "Перевод", type: string }
      - { name: today, label: "Что сделать сегодня", type: text, required: true }
      - { name: flag, label: "Когда не ждать (красный флаг)", type: text }
      - name: faq
        label: "Вопросы и ответы (для Google)"
        type: object
        list: true
        fields:
          - { name: q, label: "Вопрос", type: string }
          - { name: a, label: "Ответ", type: text }
      - name: sources
        label: "Источники"
        type: object
        list: true
        fields:
          - { name: label, label: "Название", type: string }
          - { name: url, label: "Ссылка", type: string }
      - { name: body, label: "Текст статьи", type: rich-text }

  - name: articles-en
    label: "Articles (EN)"
    type: collection
    path: cooler-site/src/content/articles/en
    filename: "{fields.slug}.md"
    view:
      fields: [ title, topic, published, draft ]
    fields:
      - { name: title, label: "Title on the page", type: string, required: true }
      - { name: slug, label: "URL slug (latin letters, hyphens)", type: string, required: true }
      - { name: lang, label: "Language", type: select, options: { values: [ru, en] }, default: en, required: true }
      - { name: translationKey, label: "Translation key (same in the RU and EN file)", type: string, required: true }
      - { name: seoTitle, label: "SEO title (up to 60 characters)", type: string, required: true }
      - { name: description, label: "SEO description (120–160 characters)", type: text, required: true }
      - { name: focusKeyword, label: "Main search phrase", type: string }
      - { name: topic, label: "Topic", type: string, required: true }
      - { name: readingTime, label: "Reading time", type: string, required: true }
      - { name: published, label: "Published", type: date, required: true }
      - { name: updated, label: "Updated", type: date }
      - { name: featured, label: "Featured article", type: boolean }
      - { name: draft, label: "Draft (hidden on the site)", type: boolean }
      - { name: reviewer, label: "Medical reviewer", type: string }
      - { name: lead, label: "Lead paragraph", type: text, required: true }
      - { name: summary, label: "In short (3–4 points)", type: string, list: true }
      - name: terms
        label: "Terms for your doctor"
        type: object
        list: true
        fields:
          - { name: term, label: "Term", type: string }
          - { name: translation, label: "Translation", type: string }
      - { name: today, label: "One thing to do today", type: text, required: true }
      - { name: flag, label: "Don’t wait (red flag)", type: text }
      - name: faq
        label: "Questions and answers (for Google)"
        type: object
        list: true
        fields:
          - { name: q, label: "Question", type: string }
          - { name: a, label: "Answer", type: text }
      - name: sources
        label: "Sources"
        type: object
        list: true
        fields:
          - { name: label, label: "Title", type: string }
          - { name: url, label: "Link", type: string }
      - { name: body, label: "Article text", type: rich-text }
